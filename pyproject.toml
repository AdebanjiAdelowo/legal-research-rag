[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-research-rag"
version = "0.1.0"
description = "Case-law retrieval, grounded research summaries and citation verification over U.S. federal opinions, with a measured evaluation of each stage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Adebanji Adelowo" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Dense encoders, cross-encoders, the entailment judge and local generation.
# The unit tests and the BM25 pipeline do not need these.
ml = ["torch>=2.2", "sentence-transformers>=3.0", "transformers>=4.44"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
legalrag = "legalrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legalrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ml: needs the optional neural dependencies and model weights",
    "data: needs the built corpus under data/processed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/*" = ["E501"]
"scripts/*" = ["E501"]
"src/legalrag/data/treatment.py" = ["E501"]
"src/legalrag/data/benchmark.py" = ["E501"]
"src/legalrag/index/bm25.py" = ["E501"]
"src/legalrag/demo.py" = ["E501"]
